<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran PPLP Siledenden</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f4f4f4; margin: 0; }
        .form-container { background: white; padding: 20px; border-radius: 8px; max-width: 100%; box-sizing: border-box; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); margin-top: 10px; }
        h2 { text-align: center; color: #333; margin-top: 0; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        button { width: 100%; padding: 12px; background-color: #0275d8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #025aa5; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Form Pendaftaran PPLP Siledenden</h2>
    <form id="registrationForm">
        <div class="form-group">
            <label for="namaSiswa">Nama Lengkap:</label>
            <input type="text" id="namaSiswa" required placeholder="Masukkan nama lengkap calon siswa">
        </div>
        <div class="form-group">
            <label for="nomorHp">Nomor WA / HP:</label>
            <input type="tel" id="nomorHp" required placeholder="Contoh: 08123456789">
        </div>
        <div class="form-group">
            <label for="jurusan">Pilihan Program Kursus:</label>
            <select id="jurusan" required>
                <option value="">-- Pilih Program --</option>
                <option value="Perhotelan">Perhotelan</option>
                <option value="Kapal Pesiar">Kapal Pesiar</option>
            </select>
        </div>
        <div class="form-group">
            <label for="alamat">Alamat Asal:</label>
            <input type="text" id="alamat" required placeholder="Masukkan kota atau desa asal">
        </div>
        <button type="submit">Kirim Pendaftaran</button>
    </form>
</div>
<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, addDoc } from "https://gstatic.com";
    const firebaseConfig = {
      apiKey: "AIzaSyBrKtBEn7jWgUF3ZnXgaPtcHcqvf0d4CjU",
      authDomain: "://firebaseapp.com",
      projectId: "gen-lang-client-0162813489",
      storageBucket: "gen-lang-client-0162813489.firebasestorage.app",
      messagingSenderId: "531318419906",
      appId: "1:531318419906:web:6997f1b54ad654cb8ca65b"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    document.getElementById("registrationForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const nama = document.getElementById("namaSiswa").value;
        const hp = document.getElementById("nomorHp").value;
        const prog = document.getElementById("jurusan").value;
        const alm = document.getElementById("alamat").value;
        try {
            await addDoc(collection(db, "pendaftar_lpk"), {
                namaSiswa: nama,
                nomorHp: hp,
                programKursus: prog,
                alamatAsal: alm,
                waktuPendaftaran: new Date().toLocaleString("id-ID")
            });
            alert("Terima kasih " + nama + ", data pendaftaran Anda berhasil dikirim!");
            document.getElementById("registrationForm").reset();
        } catch (error) {
            alert("Gagal mengirim data: " + error.message);
        }
    });
</script>
</body>
</html>
